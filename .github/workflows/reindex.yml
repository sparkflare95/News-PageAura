name: Hourly Redirects & Sitemap Re-indexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-pageaura-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Required Files
        shell: bash
        run: |
          test -f urls.txt || touch urls.txt
          test -f public/index.html || {
            echo "ERROR: public/index.html is missing."
            exit 1
          }
          test -f dd5dc9a82ae9487e912c9d3c7cbf4c71.txt || {
            echo "ERROR: IndexNow key file is missing."
            exit 1
          }

      - name: Generate Redirects and Sitemap
        run: node build-sitemap.js

      - name: Commit Accumulated Redirects and URLs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add urls.txt public/_redirects
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore: auto-generate random redirect and preserve history [skip ci]"
            git push
          }

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=news-pageaura --commit-dirty=true

      - name: Run IndexNow Ping
        if: success()
        run: node ping-indexnow.js
